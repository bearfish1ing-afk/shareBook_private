spring:
  application:
    name: realogin
  profiles:
    include: secret

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  elasticsearch:
    uris: http://localhost:9200
  data:
    elasticsearch:
      repositories:
        enabled: true
  # 4. JPA 및 하이버네이트 설정
  jpa:
    hibernate:
      default_batch_fetch_size: 100
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100 # 업데이트 쿼리 100개 모아서 쏘기

  sql:
    init:
      mode: never

# 5. 서버 포트 설정 (루트 레벨)
server:
  port: 8080

app:
  frontend-url: http://localhost:3000

